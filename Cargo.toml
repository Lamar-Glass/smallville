[package]
name = "smallville"
version = "0.1.0"
edition = "2021"
description = "A Smallville-style generative-agents experiment: watch AI agents build a civilization"
license = "MIT"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
strip = true
